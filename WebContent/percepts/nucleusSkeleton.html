<div class="bunchClassContainer bunchClassContainerStyle" id="bunchClassContainer">	
	
	<div class="nucTitleBar">
	<div class="closeNuc closeicon">
	</div>
	<div class="helpNuc helpicon">
	</div>
	</div>
	
	<!-- index attribute skeleton -->
	<div class="nucleusIndex" style="display: none;">
	<div class="f_bunchAttrPanel showbunchAttrPanel" id="bunchAttrPanel">	
			<div class="f_attrName bunchAttrNameField" contenteditable="true">New attribute</div>
			
			<div class="bunchAttrComboOperStyle" id="nucComboOper">
			<select id="nucComboOper">
			<option>=</option>
			<option>&gt;=</option>
			<option>&gt;</option>
			<option>&lt;=</option>
			<option>&lt;</option>
			<option>IN</option>
			<option>IS</option>
			<option>NOT IS</option>
			</select>
			</div>			
			
			<div class="bunchAttrIndexValueStyle" id="nucIndexValue">
			<div id="nonInterval">
			<input type="text" maxlength="200" class="midValue" />
			</div>
			<div id="Interval" style="display: none">
			<input type="text" maxlength="200" class="f_minValue" /> -
			<input type="text" maxlength="200" class="f_maxValue" />
			</div>
			</div>
			
			<div class="bunchAttrRemoveButtonPanel">
				<img src="static/images/close_pas.png" />
			</div>
	</div>
	</div>
	
	<!-- Value attribute skeleton -->
	
	<div class="nucleusValue" style="display: none;">
	<div class="v_bunchAttrPanel showbunchAttrPanel" id="bunchAttrPanel">
		<div class="f_attrName bunchAttrNameField" contenteditable="true">New Value</div>

			<!-- Optional: bind this value attribute to an NN classifier. When a classifier is chosen,
			     IS / NOT IS operators become meaningful and the value input becomes a dropdown
			     populated from the classifier's class names. -->
			<div class="bunchAttrClassifierStyle" style="display:inline-block; margin-right:6px;">
				<select class="f_classifier">
					<option value="">(no classifier)</option>
				</select>
			</div>

			<div class="bunchAttrComboOperStyle" id="nucComboOper">
			<select id="nucComboOper">
			<option>=</option>
			<option>&gt;=</option>
			<option>&gt;</option>
			<option>&lt;=</option>
			<option>&lt;</option>
			<option>IN</option>
			<option>IS</option>
			<option>NOT IS</option>
			</select>
			</div>

			<div class="bunchAttrIndexValueStyle" id="nucIndexValue">
			<div id="nonInterval">
			<input type="text" maxlength="200" class="midValue"/>
			<select class="f_symbolValue" style="display:none;"></select>
			</div>
			<div id="Interval" style="display: none">
			<input type="text" maxlength="200" class="f_minValue"/> -
			<input type="text" maxlength="200" class="f_maxValue"/>
			</div>
			</div>

		<div class="bunchAttrRemoveButtonPanel">
			<img src="static/images/close_pas.png" />
		</div>
	</div>
	</div>
	
	<div class="bunchClassHeaderPanel bunchClassHeaderPanelStyle">	
		<div id="bunchClassNameField" class="bunchClassNameField bunchClassNameFieldStyle" contenteditable="true">New Nucleus Abstract</div>	
	</div>

	<div class="parentConceptPanel">
	
	</div>
	
	<div class="indexAttributeHeader indexAttributeHeaderStyle">
		<div class="indexAttributeAdminFieldName">Index Attributes</div>
		<div class="indexAttributeAdminFieldButton" id="indexAttributeAdminFieldButton">
			<input type="button" value="Add Index Attributes" id="addIndexAttr" style="font-size: 10px;">
		</div>
	</div>
	<div class="indexAttrContainer indexAttrContainerStyle" id="indexAttrContainer">
	
	</div>
	
	<div class="valueAttributeHeader valueAttributeHeaderStyle">
		<div class="valueAttributeAdminFieldName">Value Attributes</div>
		<div class="valueAttributeAdminFieldButton" id="valueAttributeAdminFieldButton">
			<input type="button" value="Add Value Attributes" id="addValueAttr" style="font-size: 10px;">
		</div>
	</div>
	<div class="valueAttrContainer valueAttrContainerStyle" id="valueAttrContainer">
	
	</div>
	
</div>
