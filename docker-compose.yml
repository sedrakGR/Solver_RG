version: "3.9"
services:
  mongo:
    image: mongo:3.4
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  app:
    build: .
    depends_on: ["mongo"]
    ports: ["8080:8080"]
    environment:
      MONGO_URL: mongodb://mongo:27017/yourdb

volumes:
  mongo_data:
